server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bank_auth
    username: bank_user
    password: securePassword123!
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyChangeInProduction1234567890}
    expiration-milliseconds: 86400000 # 24 horas
    issuer: bank-auth-service
    refresh-expiration-milliseconds: 604800000 # 7 días
  security:
    permit-all-paths:
      - "/auth/login"
      - "/auth/refresh"
      - "/swagger-ui/**"
      - "/v3/api-docs/**"
      - "/actuator/health"
  timezone: UTC

logging:
  level:
    root: INFO
    com.bank.auth: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE